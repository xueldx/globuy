[alembic]
# Migration scripts dir (relative to alembic.ini; migrate.py re-sets it to an
# absolute path for programmatic calls).
# NOTE: keep this file ASCII-only. Alembic reads it with configparser using the
# locale encoding (GBK on Chinese Windows), so any non-ASCII byte here crashes
# `alembic upgrade` regardless of PYTHONUTF8.
script_location = alembic

# Placeholder: the real URL is filled in alembic/env.py using the same
# DATABASE_URL parsing rules as the app, so there is no config drift.
sqlalchemy.url =
